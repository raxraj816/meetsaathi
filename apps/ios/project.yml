# XcodeGen spec for the iOS app target. Generate the project with:  xcodegen generate  (then open MeetSaathi.xcodeproj)
name: MeetSaathi
options:
  bundleIdPrefix: app.meetsaathi
  developmentLanguage: en   # UI copy: App/Localizable.xcstrings (generated by qa/i18n/gen_strings.py)
  deploymentTarget: { iOS: "17.0" }
packages:
  MeetSaathiKit: { path: . }
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
configs:
  Debug: { MS_API_BASE_URL: "http://localhost:8080" }
  Release: { MS_API_BASE_URL: "https://api.meetsaathi.example" }
targets:
  MeetSaathi:
    type: application
    platform: iOS
    sources: [App]
    info: { path: App/Info.plist }
    dependencies: [{ package: MeetSaathiKit }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.meetsaathi
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO

[project]
name = "meetsaathi-backend"
version = "1.0.0"
description = "MeetSaathi modular backend: identity/policy, sessions, audio ingest, speech, intelligence, memory, workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "cryptography>=43",
  "anthropic>=1.15",
  "httpx>=0.27",
  "boto3>=1.43.0,<2",
  "amazon-transcribe>=0.6.4,<0.7",
  "jsonschema>=4.23,<5",
  "opentelemetry-sdk>=1.35,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.35,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Local/staging stack: Postgres 16 + pgvector, one migration job, API and a separate worker.
# Secrets come from infra/.env (copy infra/.env.example). Never commit real secrets.
name: meetsaathi
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: meetsaathi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetsaathi"]
      interval: 5s
      retries: 20
  migrate:
    build: ../backend
    env_file: .env
    command: ["python", "-m", "app.migrate"]
    depends_on: {db: {condition: service_healthy}}
  api:
    build: ../backend
    env_file: .env
    environment: {MS_RUN_INLINE_WORKER: "false"}
    ports: ["8080:8080"]
    volumes: [objects:/var/lib/meetsaathi/objects]
    depends_on: {migrate: {condition: service_completed_successfully}}
  worker:
    build: ../backend
    env_file: .env
    command: ["python", "-m", "app.workers.runner"]
    volumes: [objects:/var/lib/meetsaathi/objects]
    depends_on: {migrate: {condition: service_completed_successfully}}
volumes:
  pgdata: {}
  objects: {}
